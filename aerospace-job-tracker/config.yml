keywords:
  include:
    - aerospace
    - aeronautical
    - flight test
    - flight controls
    - systems engineer
    - systems integration
    - controls engineer
    - gnc
    - guidance navigation control
    - avionics
    - mechanical engineer
    - propulsion
    - structures engineer
    - structural engineer
    - integration engineer
    - spacecraft
    - satellite
    - uav
    - uas
    - unmanned
    - autonomy
    - embedded
    - new grad
    - entry level
    - engineer i
    - associate engineer
    - rotational program
  exclude:
    - senior
    - principal
    - staff engineer
    - lead engineer
    - chief engineer
    - engineering lead
    - manager
    - director
    - phd required
    - 8+ years
    - 10+ years
    - 7+ years
    - level iv
    - level v
    - engineer iv
    - engineer v
    - 2026 early career
    - 2026 starts
    - intern
    - internship
    - co-op

# Add or replace URLs with specific search-result pages from each employer.
# Search pages work better than general career homepages.
sources:
  - company: Lockheed Martin
    url: https://www.lockheedmartinjobs.com/search-jobs
  - company: Northrop Grumman
    url: https://www.northropgrumman.com/careers
  - company: RTX
    url: https://careers.rtx.com/global/en/search-results
    adapter: workday
    api_url: https://globalhr.wd5.myworkdayjobs.com/wday/cxs/globalhr/REC_RTX_Ext_Gateway/jobs
    base_url: https://globalhr.wd5.myworkdayjobs.com/en-US/REC_RTX_Ext_Gateway/
  - company: Boeing
    url: https://jobs.boeing.com/search-jobs
  - company: L3Harris
    url: https://careers.l3harris.com/search-jobs
  - company: Sierra Space
    url: https://www.sierraspace.com/careers/
    adapter: workday
    api_url: https://sierraspace.wd1.myworkdayjobs.com/wday/cxs/sierraspace/Sierra_Space_External_Career_Site/jobs
    base_url: https://sierraspace.wd1.myworkdayjobs.com/en-US/Sierra_Space_External_Career_Site/
  - company: Blue Origin
    url: https://www.blueorigin.com/careers/search
    adapter: workday
    api_url: https://blueorigin.wd5.myworkdayjobs.com/wday/cxs/blueorigin/BlueOrigin/jobs
    base_url: https://blueorigin.wd5.myworkdayjobs.com/en-US/BlueOrigin/
  - company: Shield AI
    url: https://shield.ai/careers/
  - company: Anduril
    url: https://www.anduril.com/open-roles/
    adapter: greenhouse
    api_url: https://boards-api.greenhouse.io/v1/boards/andurilindustries/jobs
  - company: General Atomics
    url: https://www.ga-careers.com/search-jobs

settings:
  request_timeout_seconds: 25
  maximum_links_per_source: 250
  issue_title_prefix: "Weekly aerospace job openings"
